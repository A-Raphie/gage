name: gage-worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: gage-worker
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install worker deps
        run: cd worker && npm install --no-audit --no-fund
      - name: Settle pending payments
        run: cd worker && npx tsx index.ts
        env:
          PRIVATE_KEY: ${{ secrets.GAGE_WORKER_KEY }}
          GAGE_DEAL_ADDRESS: "0xA93DD76Ce639Dd9BE4C780363d54706E098aa1c4"
          GAGE_SETTLEMENT_ADDRESS: "0xA93DD76Ce639Dd9BE4C780363d54706E098aa1c4"
          START_BLOCK: "0"
          RUN_ONCE: "1"
